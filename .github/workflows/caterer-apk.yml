# Builds the Catera Dapur preview APK on EAS (project 1c3f597c-4cba-498d-9d14-48b9c5ebafcc).
name: Catera Dapur Android APK

on:
  push:
    branches: [v2]
    paths:
      - "apps/caterer/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "app.json"
      - "scripts/sync-assets.mjs"
      - ".npmrc"
      - ".easignore"
      - ".github/workflows/caterer-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caterer-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add the EXPO_TOKEN repository secret with access to the Catera Dapur EAS project.'
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 16.28.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Check native types and tests
        run: |
          npm run typecheck -w @catera/caterer
          npm run test -w @catera/caterer
          npm test
      - name: Validate EAS preview configuration
        working-directory: apps/caterer
        run: |
          eas env:pull --environment preview --path .env.local --non-interactive
          node --env-file=.env.local --input-type=module <<'JS'
          const required = ['EXPO_PUBLIC_API_URL', 'EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY', 'EXPO_PUBLIC_EAS_PROJECT_ID'];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Configure ${name} in the EAS preview environment.`);
          }
          for (const name of required.slice(0, 2)) {
            const url = new URL(process.env[name]);
            if (url.protocol !== 'https:' || ['localhost', '127.0.0.1', '10.0.2.2', '[::1]'].includes(url.hostname)) {
              throw new Error(`${name} must be a phone-accessible HTTPS endpoint.`);
            }
          }
          const base = process.env.EXPO_PUBLIC_API_URL.trim().replace(/\/+$/, '');
          for (const path of ['catalog?limit=1', 'me']) {
            const response = await fetch(`${base}/api/v1/${path}`, { signal: AbortSignal.timeout(15000) });
            let result;
            try { result = await response.json(); }
            catch { throw new Error(`EXPO_PUBLIC_API_URL returned a web page instead of Catera API data for ${path}. Check that the backend or tunnel is running.`); }
            const valid = path.startsWith('catalog')
              ? Array.isArray(result?.data?.items)
              : result?.data && typeof result.data.demo === 'boolean' && 'actor' in result.data;
            if (!response.ok || !valid) throw new Error(`Catera API check failed for ${path} (HTTP ${response.status}). Fix EXPO_PUBLIC_API_URL before building.`);
          }
          JS
      - name: Build and publish installable APK to EAS
        working-directory: apps/caterer
        run: eas build --platform android --profile preview --non-interactive --wait --json --message "$GITHUB_SHA" > "$RUNNER_TEMP/eas-build.json"
      - name: Add APK link to run summary
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const builds = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/eas-build.json`, 'utf8'));
          const build = builds.find(item => item.platform === 'ANDROID');
          const url = build?.artifacts?.applicationArchiveUrl || build?.artifacts?.buildUrl;
          if (build?.status !== 'FINISHED' || !url) throw new Error('EAS did not return a completed Android APK.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Catera Dapur Android APK\n\nCommit: \`${process.env.GITHUB_SHA}\`\n\n[Download and install APK](${url})\n\nEAS build ID: \`${build.id}\`\n`);
          JS
