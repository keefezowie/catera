# One-off: create the Catera Dapur EAS project with the repository's EXPO_TOKEN
# and copy the customer project's preview environment into it. The project ID
# is printed as a notice so it can be written into apps/caterer/app.config.ts.
name: Catera Dapur EAS setup

on:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/caterer-eas-setup.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caterer-eas-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 16.28.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Create or find the Catera Dapur project
        id: project
        working-directory: apps/caterer
        run: |
          set -o pipefail
          eas init --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/init.log" || true
          id=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/init.log" | tail -1)
          if [ -z "$id" ]; then
            echo "::error::eas init did not report a project ID (see the log above)."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "::notice title=CATERA_DAPUR_EAS_PROJECT_ID::$id"
      - name: Copy the customer preview environment
        run: |
          cd apps/customer
          eas env:pull --environment preview --path "$RUNNER_TEMP/customer.env" --non-interactive
          cd ../caterer
          export EXPO_PUBLIC_EAS_PROJECT_ID="${{ steps.project.outputs.id }}"
          set -a; . "$RUNNER_TEMP/customer.env"; set +a
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::error::$name is missing from the customer preview environment."; exit 1; fi
            eas env:create --name "$name" --value "$value" --environment preview --visibility plaintext --non-interactive --force
          done
          eas env:create --name EXPO_PUBLIC_EAS_PROJECT_ID --value "$EXPO_PUBLIC_EAS_PROJECT_ID" --environment preview --visibility plaintext --non-interactive --force
          echo "::notice title=Catera Dapur preview environment::Copied API, Supabase URL and publishable key from the customer project."
