name: Native Android APK

on:
  push:
    branches: [v1]
    paths:
      - "apps/customer/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "app.json"
      - "scripts/sync-assets.mjs"
      - ".npmrc"
      - ".easignore"
      - ".github/workflows/native-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/v1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: h8dqXFVPhHLVxhMsWY8WsiIkoRW5PDx02YmpEjmU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add the EXPO_TOKEN repository secret with access to the customer EAS project.'
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 16.28.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Check native types and tests
        run: |
          npm run typecheck -w @catera/customer
          npm run test -w @catera/customer
          npm test
      - name: Validate EAS preview configuration
        working-directory: apps/customer
        run: |
          eas env:pull --environment preview --path .env.local --non-interactive
          node --env-file=.env.local --input-type=module <<'JS'
          const required = ['EXPO_PUBLIC_API_URL', 'EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY'];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Configure ${name} in the EAS preview environment.`);
          }
          for (const name of required.slice(0, 2)) {
            const url = new URL(process.env[name]);
            if (url.protocol !== 'https:' || ['localhost', '127.0.0.1', '10.0.2.2', '[::1]'].includes(url.hostname)) {
              throw new Error(`${name} must be a phone-accessible HTTPS endpoint.`);
            }
          }
          JS
      - name: Build and publish installable APK to EAS
        working-directory: apps/customer
        run: eas build --platform android --profile preview --non-interactive --wait --json --message "$GITHUB_SHA" > "$RUNNER_TEMP/eas-build.json"
      - name: Add APK link to run summary
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const builds = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/eas-build.json`, 'utf8'));
          const build = builds.find(item => item.platform === 'ANDROID');
          const url = build?.artifacts?.applicationArchiveUrl || build?.artifacts?.buildUrl;
          if (build?.status !== 'FINISHED' || !url) throw new Error('EAS did not return a completed Android APK.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Catera Android APK\n\nCommit: \`${process.env.GITHUB_SHA}\`\n\n[Download and install APK](${url})\n\nEAS build ID: \`${build.id}\`\n`);
          JS
