# Temporary: surface the Catera Dapur EAS build error as an annotation.
name: Catera Dapur EAS diagnose

on:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/caterer-eas-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 16.28.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: First build in a terminal so EAS can create the Android keystore
        working-directory: apps/caterer
        run: |
          python3 - > "$RUNNER_TEMP/out.log" 2>&1 <<'PY' || true
          import os, pty, select, sys, time
          pid, fd = pty.fork()
          if pid == 0:
              os.execvp("eas", ["eas", "build", "--platform", "android", "--profile", "preview", "--no-wait", "--message", "first-keystore"])
          end = time.time() + 900
          while time.time() < end:
              ready, _, _ = select.select([fd], [], [], 1)
              if fd in ready:
                  try:
                      data = os.read(fd, 4096)
                  except OSError:
                      break
                  if not data:
                      break
                  sys.stdout.buffer.write(data)
                  sys.stdout.flush()
                  if b"?" in data[-300:]:
                      time.sleep(1)
                      os.write(fd, b"\r")
              done, _ = os.waitpid(pid, os.WNOHANG)
              if done:
                  break
          PY
          tail -40 "$RUNNER_TEMP/out.log" | sed -e 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/tail.log"
          msg=$(awk '{printf "%s%%0A", $0}' "$RUNNER_TEMP/tail.log")
          echo "::notice title=EAS build output::$msg"
