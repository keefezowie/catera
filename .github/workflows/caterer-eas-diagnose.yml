# Temporary: surface the Catera Dapur EAS build error as an annotation.
name: Catera Dapur EAS diagnose

on:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/caterer-eas-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 16.28.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Try the build without waiting
        working-directory: apps/caterer
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait > "$RUNNER_TEMP/out.log" 2>&1 || true
          tail -40 "$RUNNER_TEMP/out.log" | sed -e 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/tail.log"
          msg=$(awk '{printf "%s%%0A", $0}' "$RUNNER_TEMP/tail.log")
          echo "::notice title=EAS build output::$msg"
