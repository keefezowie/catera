# Calls GET /api/jobs/push every 15 minutes (arrival reminders, the 3-days-left renewal push,
# then sending due pushes).
#
# IMPORTANT: GitHub runs `schedule` triggers only from the repository's DEFAULT branch
# (currently `main`). While this file exists only on `v2` it never runs on schedule; only a
# manual workflow_dispatch from the v2 branch works. To use it, put this file on the default
# branch and add the repository secrets CRON_SECRET and CATERA_PUBLIC_URL, or use a platform
# scheduler instead. Both options are in docs/RUNBOOK.md, section 14.
name: Catera push jobs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: push-jobs
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      CATERA_PUBLIC_URL: ${{ secrets.CATERA_PUBLIC_URL }}
    steps:
      - name: Queue and send due pushes
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$CATERA_PUBLIC_URL" ]; then
            echo '::error::Add the CRON_SECRET and CATERA_PUBLIC_URL repository secrets.'
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$CATERA_PUBLIC_URL/api/jobs/push"
