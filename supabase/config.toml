project_id = "catera"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000/auth/confirm", "http://127.0.0.1:3000/auth/confirm"]
jwt_expiry = 3600
minimum_password_length = 8
enable_signup = true
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 600
otp_length = 6

[auth.email.template.confirmation]
subject = "Verifikasi akun Catera / Verify your Catera account"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Pulihkan akun Catera / Recover your Catera account"
content_path = "./supabase/templates/recovery.html"
